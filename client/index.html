    <script>
      (function () {
        try {
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true;
          var hasToken = !!localStorage.getItem('token');
          if (!standalone && !hasToken) return;
          var root = document.documentElement;
          root.classList.add('lyra-hide-prerender');
          if (localStorage.getItem('lyra:colorMode') === 'light') {
            root.classList.add('lyra-splash-light');
          }
        } catch (_) {}
